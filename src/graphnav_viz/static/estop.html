<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spot E-Stop</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: ui-sans-serif, system-ui, sans-serif; background: #1a1d23;
         color: #e6e6e6; display: flex; flex-direction: column; padding: 0.8rem; gap: 0.5rem; }
  #banner { padding: 0.6rem; border-radius: 4px; text-align: center;
            font-weight: bold; font-size: 14px; background: #2d3748; }
  button { width: 100%; padding: 0.7rem; border: 0; border-radius: 4px;
           font-weight: bold; font-size: 14px; cursor: pointer; color: white; }
  button:disabled { background: #4a5568 !important; cursor: default; }
  .soft  { background: #c05621; }   .soft:hover  { background: #dd6b20; }
  .hard  { background: #9b2c2c; }   .hard:hover  { background: #c53030; }
  .allow { background: #2f855a; }   .allow:hover { background: #38a169; }
  .meta  { font-family: ui-monospace, monospace; font-size: 11px; color: #a0aec0; }
</style>
</head>
<body>
  <div id="banner">connecting…</div>
  <button id="settle" class="soft">Settle-then-cut</button>
  <button id="cut"    class="hard">Hard cut</button>
  <button id="allow"  class="allow" disabled>Allow / re-arm</button>
  <div class="meta" id="meta"></div>

<script>
const banner = document.getElementById('banner');
const meta   = document.getElementById('meta');
const allow  = document.getElementById('allow');

const COLORS = {
  allowed:  { bg: '#22543d', text: '● ARMED — motion allowed' },
  settling: { bg: '#7b341e', text: '● SETTLING — sit then cut' },
  cut:      { bg: '#742a2a', text: '● CUT — motors off' },
  unknown:  { bg: '#2d3748', text: '● unknown' },
};

async function poll() {
  try {
    const r = await fetch('/api/estop/state');
    if (!r.ok) throw new Error(r.status);
    const e = await r.json();
    const c = COLORS[e.level] || COLORS.unknown;
    banner.style.background = c.bg;
    banner.textContent = c.text;
    meta.textContent = `endpoint: ${e.endpoint_registered ? 'registered' : 'NOT registered'}`
      + (e.any_other_estopped ? ' · another estop active' : '');
    allow.disabled = !(e.endpoint_registered && e.level !== 'allowed');
  } catch {
    banner.style.background = '#2d3748';
    banner.textContent = '● disconnected';
    allow.disabled = true;
  }
}

function send(path) {
  return fetch(path, { method: 'POST' }).then(poll);
}

document.getElementById('settle').addEventListener('click', () => send('/api/estop/settle'));
document.getElementById('cut').addEventListener('click',    () => send('/api/estop/cut'));
document.getElementById('allow').addEventListener('click',  () => send('/api/estop/allow'));

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
